name: Deploy Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified build to GitHub Pages (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: Install the configured Tola release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/tola"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("config/docs.toml", "rb"))["modules"]["docs"]["options"]["versions"]["tola"])')
          archive="tola-${version}-x86_64-unknown-linux-musl.tar.gz"
          release="repos/tola-rs/tola-ssg/releases/tags/v${version}"
          digest=$(gh api "$release" | jq -er --arg file "$archive" '.assets[] | select(.name == $file) | .digest | strings | select(test("^sha256:[0-9a-f]{64}$"))')
          gh release download "v$version" -R tola-rs/tola-ssg --pattern "$archive" --dir "$RUNNER_TEMP/tola"
          (
            cd "$RUNNER_TEMP/tola"
            printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum -c -
            tar -xzf "$archive"
          )
          printf '%s\n' "$RUNNER_TEMP/tola" >> "$GITHUB_PATH"
      - name: Build with the Tola release
        shell: bash
        run: |
          tola docs setup
          tola docs check
          tola build -o release-site
          test -s release-site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        with:
          path: release-site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
