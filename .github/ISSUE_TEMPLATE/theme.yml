name: Theme submission
description: Submit a reusable Tola theme for the gallery.
title: "[Theme] "
body:
  - type: markdown
    attributes:
      value: |
        Use the theme name in the issue title. A maintainer will check the license and build before adding the theme to the gallery.

  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Link to the public source repository with its license and setup instructions.
      placeholder: https://github.com/you/my-theme
    validations:
      required: true

  - type: input
    id: demo
    attributes:
      label: Live demo URL
      placeholder: https://example.com
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description (English)
      description: One or two sentences describing the theme.
    validations:
      required: true

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: Upload a screenshot of the demo home page. A 16:10 image fits the gallery best.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.webp"

  - type: textarea
    id: build
    attributes:
      label: Build details
      description: Share the Tola version you tested and any special build steps.
